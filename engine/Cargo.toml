[package]
name = "aqua_engine"
version = "0.1.0"
edition = "2024"
description = "Watercolor + ink simulation engine for the Aqua Android app"
publish = false

[lib]
name = "aqua_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles", "wgsl", "std"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
half = { version = "2", features = ["bytemuck"] }
png = "0.18"
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.9"
android_logger = "0.15"

[dev-dependencies]
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
