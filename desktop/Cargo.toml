[package]
name = "aqua_desktop"
version = "0.1.0"
edition = "2024"
description = "Aqua for the desktop (Linux, macOS): the same Rust engine on wgpu, with an egui UI"
publish = false

[[bin]]
name = "aqua"
path = "src/main.rs"

[dependencies]
aqua_engine = { path = "../engine" }
aqua_sync = { path = "../sync" }
winit = "0.30.13"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "wayland", "x11"] }
egui-wgpu = { version = "0.37", default-features = false }
wgpu = { version = "30", default-features = false, features = ["wgsl", "std"] }
pollster = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
