[package]
name = "aqua_web"
version = "0.1.0"
edition = "2024"
description = "Browser bindings for the Aqua engine (WebGPU through wgpu)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aqua_engine = { path = "../engine" }
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl", "std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
